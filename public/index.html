<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagsViewer — AWS Tagging Graph</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">⬡</span>
    <span class="brand-text">TagsViewer</span>
  </div>
  <ul class="nav-menu" id="navMenu">
    <li class="nav-item active" data-view="projects">
      <span class="nav-icon">📁</span> Progetti
    </li>
    <li class="nav-item disabled" data-view="upload">
      <span class="nav-icon">📤</span> Documenti
    </li>
    <li class="nav-item disabled" data-view="graph">
      <span class="nav-icon">🕸</span> Grafo 3D
    </li>
    <li class="nav-item disabled" data-view="export">
      <span class="nav-icon">📊</span> Esporta
    </li>
  </ul>
  <div class="sidebar-project" id="sidebarProject" style="display:none">
    <div class="project-label">Progetto attivo</div>
    <div class="project-name" id="sidebarProjectName">—</div>
    <div class="project-stats" id="sidebarProjectStats"></div>
  </div>
</nav>

<main class="main">
  <div id="viewProjects" class="view active"></div>
  <div id="viewUpload"   class="view"></div>
  <div id="viewGraph"    class="view"></div>
  <div id="viewExport"   class="view"></div>
</main>

<!-- Chat panel (float) -->
<div id="chatPanel" class="chat-panel hidden">
  <div class="chat-header">
    <span>💬 Assistente FinOps</span>
    <button id="chatClose" class="btn-icon">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <form class="chat-input-row" id="chatForm">
    <input type="text" id="chatInput" placeholder="Chiedi qualcosa sulle risorse…" autocomplete="off">
    <button type="submit" class="btn-primary">Invia</button>
  </form>
</div>
<button id="chatToggle" class="chat-fab hidden" title="Assistente FinOps">💬</button>

<!-- Toast container -->
<div id="toastContainer"></div>

<script type="module" src="/js/api.js"></script>
<script type="module" src="/js/views/projects.js"></script>
<script type="module" src="/js/views/upload.js"></script>
<script type="module" src="/js/views/graph.js"></script>
<script type="module" src="/js/views/export.js"></script>
<script type="module" src="/js/components/chat.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
